<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Orders Web</title>
  <style>
    :root {
      --lotus-green: #269984;
      --lotus-green-dark: #1f7d6c;
      --lotus-green-soft: #e6f4f1;
      --lotus-yellow: #f4c534;
      --lotus-yellow-dark: #e3b424;
      --lotus-yellow-soft: #fdf7e2;
      --ink-dark: #102538;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      font-family: 'Sarabun', Tahoma, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #ffffff;
      color: #000000;
    }

    .container {
      max-width: 980px;
      height: 100vh;
      margin: 0 auto;
      background: #ffffff;
      padding: 12px 15px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ================= แถบประวัติการสั่งสินค้า ================= */
    .history-top-bar {
      border: none;
      background-color: var(--lotus-yellow);
      color: var(--ink-dark);
      padding: 6px 10px;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-shrink: 0;
    }

    .saved-history-btn {
      border: none;
      background-color: #ffffff;
      color: var(--ink-dark);
      font-weight: bold;
      font-size: 13px;
      padding: 5px 12px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .saved-history-btn:hover {
      background-color: #f4f6f8;
    }

    /* ================= โลโก้มุมขวาบนใต้ Order Form ================= */
    .top-right-brand-box {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 4px;
      flex-shrink: 0;
    }

    .mini-orders-web-logo {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 0.98;
      user-select: none;
      padding: 2px 6px;
    }

    .mini-orders-web-logo .logo-top {
      font-size: 18px;
      font-weight: 900;
      color: var(--lotus-yellow);
      letter-spacing: -0.3px;
    }

    .mini-orders-web-logo .logo-bottom {
      font-size: 18px;
      font-weight: 900;
      color: var(--lotus-green);
      letter-spacing: -0.3px;
    }

    /* ================= หน้า Log In ================= */
    .login-screen {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      padding: 16px;
      overflow-y: auto;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background-color: #ffffff;
      border-radius: 14px;
      box-shadow: 0 12px 32px rgba(16, 37, 56, 0.12);
      border: 1px solid #eef2f6;
      padding: 28px 24px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .login-brand {
      text-align: center;
      line-height: 1.05;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: -0.5px;
    }

    .login-brand .brand-orders {
      display: block;
      color: var(--lotus-yellow);
    }

    .login-brand .brand-web {
      display: block;
      color: var(--lotus-green);
      margin-top: 2px;
    }

    .login-sub {
      font-size: 14px;
      color: #475467;
      text-align: center;
      line-height: 1.4;
      margin-top: -2px;
    }

    .login-field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .login-field-group label {
      font-size: 13px;
      font-weight: 700;
      color: var(--lotus-green);
    }

    .login-input-wrap {
      border: 1.5px solid var(--lotus-green);
      border-radius: 8px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      background-color: #ffffff;
      min-height: 44px;
    }

    .login-input-wrap input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 15px;
      background: transparent;
      color: #000000;
    }

    .remember-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 2px;
    }

    .remember-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 600;
      color: #102538;
      cursor: pointer;
      user-select: none;
    }

    .remember-label input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: var(--lotus-green);
      cursor: pointer;
      margin: 0;
    }

    .login-btn {
      background-color: var(--lotus-green);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 0.4px;
      cursor: pointer;
      min-height: 44px;
    }

    .login-btn:hover:not(:disabled) {
      background-color: var(--lotus-green-dark);
    }

    .login-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .login-secondary-btn {
      background-color: var(--lotus-yellow-soft);
      color: var(--ink-dark);
      border: 1px solid var(--lotus-yellow);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13.5px;
      font-weight: bold;
      cursor: pointer;
      min-height: 38px;
    }

    .login-secondary-btn:hover:not(:disabled) {
      background-color: var(--lotus-yellow);
    }

    .login-msg {
      min-height: 18px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      color: #d92d20;
    }

    .login-msg.info {
      color: #475467;
    }

    .logout-btn {
      border: none;
      background-color: #d92d20;
      color: #ffffff;
      font-weight: bold;
      font-size: 12px;
      padding: 5px 10px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .logout-btn:hover {
      background-color: #b42318;
    }

    .top-bar {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .summary-date-time-row {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 10px;
      margin-bottom: 8px;
    }

    .section-box {
      border: none;
      padding: 10px 12px;
      margin-bottom: 10px;
      flex-shrink: 0;
      background-color: #ffffff;
    }

    .catalog-box {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      margin-bottom: 0;
      overflow: hidden;
      background-color: #ffffff;
    }

    .delivery-row-1 {
      display: grid;
      grid-template-columns: 2.8fr 1.3fr;
      gap: 10px;
      margin-bottom: 8px;
    }

    .delivery-row-2 {
      width: 100%;
    }

    .inline-validation-note {
      margin-top: 6px;
      font-size: 13px;
      font-weight: bold;
      color: #d92d20;
      display: none;
    }

    .inline-validation-note.active {
      display: block;
    }

    .search-bar {
      display: grid;
      grid-template-columns: 3.6fr 1.2fr 1.0fr;
      gap: 8px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .field-box {
      border: none;
      padding: 5px 10px;
      display: flex;
      align-items: center;
      background-color: #ffffff;
      min-height: 38px;
    }

    .field-box.missing-required {
      border: none;
      background-color: #fff5f5;
    }

    .search-field-box {
      border: 1.5px solid #2c3e50;
      padding-right: 4px;
      gap: 6px;
      position: relative;
    }

    .field-box label {
      font-weight: bold;
      white-space: nowrap;
      margin-right: 6px;
      font-size: 14px;
      color: #000000;
    }

    .field-box input,
    .field-box select {
      border: none;
      outline: none;
      width: 100%;
      font-size: 14px;
      font-weight: normal;
      background: transparent;
      color: #000000;
    }

    .cust-locked-input {
      color: var(--lotus-green) !important;
      font-weight: normal !important;
      cursor: default;
    }

    .red-filled-text {
      color: #d92d20 !important;
      font-weight: normal !important;
    }

    #totalAmount {
      color: #d92d20;
      font-weight: bold;
    }

    .category-group {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .category-select {
      width: auto !important;
      min-width: 135px;
      max-width: 205px;
      height: 30px;
      padding: 0 8px;
      background-color: var(--lotus-yellow) !important;
      border: none !important;
      color: var(--ink-dark);
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .category-select:hover {
      background-color: var(--lotus-yellow-dark) !important;
    }

    .category-select.has-filter {
      background-color: var(--lotus-yellow-dark) !important;
      color: var(--ink-dark);
    }

    .category-select option {
      background-color: #ffffff;
      color: var(--ink-dark);
      font-weight: bold;
    }

    .cat-refresh-icon-btn {
      width: 30px;
      height: 30px;
      padding: 0;
      background-color: var(--lotus-yellow);
      border: none;
      color: var(--ink-dark);
      font-weight: bold;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .cat-refresh-icon-btn:hover:not(:disabled) {
      background-color: var(--lotus-yellow-dark);
    }

    .cat-refresh-icon-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .confirm-box-green {
      background-color: var(--lotus-green);
      cursor: pointer;
      justify-content: center;
      border: none;
      min-height: 38px;
    }

    .confirm-box-green:hover {
      background-color: var(--lotus-green-dark);
    }

    .confirm-box-green span,
    .confirm-box-green button {
      color: #ffffff;
      font-weight: bold;
      font-size: 15px;
      background: transparent;
      border: none;
      cursor: pointer;
    }

    .product-wrapper {
      border: none;
      padding: 8px;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      background-color: #ffffff;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
      background-color: #ffffff;
    }

    .category-sections-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .category-section-block {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .category-section-header {
      background-color: var(--lotus-yellow);
      color: var(--ink-dark);
      border: none;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .category-horizontal-row {
      display: flex;
      flex-direction: row;
      gap: 6px;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: contain;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }

    .category-horizontal-row .product-card {
      flex: 0 0 112px;
      width: 112px;
    }

    .product-card {
      border: 1.5px solid #2c3e50;
      padding: 5px;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 5px;
      min-height: 292px;
    }

    .card-img-box {
      border: none;
      height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background-color: #ffffff;
      overflow: hidden;
    }

    .card-img-box img {
      max-width: 92%;
      max-height: 92%;
      object-fit: contain;
      background-color: #ffffff;
    }

    .price-tag {
      position: absolute;
      top: 3px;
      right: 3px;
      background: #ffffff;
      color: #d92d20;
      border: none;
      font-size: 10px;
      font-weight: bold;
      padding: 1px 5px;
      z-index: 2;
    }

    .card-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2px;
      min-height: 18px;
      background-color: #ffffff;
    }

    .code-barcode-text {
      font-size: 9px;
      font-weight: 600;
      color: #333;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      text-align: left;
      padding: 0 1px;
    }

    .code-sep {
      color: #666;
      margin: 0 1.5px;
    }

    .unit-badge {
      border: none;
      padding: 1px 5px;
      text-align: center;
      font-size: 9px;
      font-weight: bold;
      white-space: nowrap;
      flex-shrink: 0;
      background-color: #000000;
      color: #ffffff;
    }

    .card-name-box {
      border: none;
      padding: 4px;
      text-align: center;
      font-size: 11px;
      font-weight: bold;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.25;
      background-color: #ffffff;
      color: #000000;
    }

    .card-action-row {
      display: grid;
      grid-template-columns: 20px 30px 20px 1fr;
      gap: 2px;
      align-items: stretch;
      min-height: 28px;
      background-color: #ffffff;
    }

    .qty-btn {
      border: none;
      background: #f4f6f8;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      touch-action: manipulation;
    }

    .qty-btn:hover {
      background-color: #e4e7ec;
    }

    .qty-input {
      border: none;
      background-color: #f4f6f8;
      width: 100%;
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      outline: none;
      padding: 0 2px;
      scroll-margin: 24px;
      touch-action: manipulation;
      -moz-appearance: textfield;
    }

    .qty-input::-webkit-outer-spin-button,
    .qty-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .confirmed-status-box {
      border: none;
      padding: 1px 3px;
      text-align: center;
      font-size: 9.5px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.1;
      background-color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .confirmed-status-box.has-qty {
      background-color: var(--lotus-green-soft);
      color: var(--lotus-green-dark);
    }

    .status-text {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 0;
      font-weight: bold;
      color: #555;
      line-height: 1.6;
      background-color: #ffffff;
    }

    /* ================= หน้าสรุปรายการสั่งซื้อ ================= */
    .summary-screen {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      background-color: #ffffff;
    }

    .summary-screen.active {
      display: flex;
    }

    .summary-header-bar {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 10px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .back-btn {
      border: none;
      background-color: #f4f6f8;
      color: #000000;
      font-weight: bold;
      font-size: 14px;
      padding: 8px 10px;
      cursor: pointer;
      min-height: 40px;
    }

    .back-btn:hover {
      background-color: #e4e7ec;
    }

    .summary-title-box {
      border: none;
      background-color: var(--lotus-yellow);
      color: var(--ink-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
      padding: 6px 12px;
      min-height: 40px;
      text-align: center;
    }

    .summary-panel {
      border: none;
      background-color: #ffffff;
      padding: 12px;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .summary-customer-box {
      border: none;
      background-color: #ffffff;
      padding: 8px 10px;
      font-size: 14px;
      font-weight: 600;
      min-height: 36px;
      display: flex;
      align-items: center;
      word-break: break-word;
    }

    .summary-delivery-card {
      border: none;
      background-color: #ffffff;
      padding: 10px 12px;
    }

    .summary-action-bar {
      display: grid;
      grid-template-columns: 1.4fr 1.2fr 1fr;
      gap: 8px;
      align-items: stretch;
    }

    .summary-total-box {
      border: none;
      background-color: #ffffff;
      padding: 8px 10px;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      align-items: center;
      min-height: 40px;
    }

    #sumMoneyTotal {
      color: #d92d20;
    }

    .summary-items-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }

    .summary-item-card {
      border: none;
      background-color: #ffffff;
      padding: 10px 12px;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ================= หน้า Order Form ================= */
    .history-screen {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      background-color: #ffffff;
    }

    .history-screen.active {
      display: flex;
    }

    .history-body {
      border: none;
      background-color: #ffffff;
      padding: 12px;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .history-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .history-record-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-record-row {
      border: none;
      padding: 10px 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background-color: #ffffff;
      font-size: 13px;
    }

    .history-record-row.selected {
      background-color: var(--lotus-yellow-soft);
    }

    .stamp-badge {
      display: inline-block;
      background-color: var(--lotus-yellow);
      color: var(--ink-dark);
      border: none;
      padding: 2px 7px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 2px;
    }

    .image-preview-box {
      border: none;
      padding: 10px;
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .image-preview-box img {
      max-width: 100%;
      height: auto;
      border: none;
      background-color: #ffffff;
    }

    .action-small-btn {
      border: none;
      background-color: var(--lotus-yellow);
      color: var(--ink-dark);
      font-weight: bold;
      font-size: 13px;
      padding: 7px 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      line-height: 1.2;
      min-width: 72px;
      min-height: 36px;
    }

    .action-small-btn:hover {
      background-color: var(--lotus-yellow-dark);
    }

    .action-small-btn.save-green {
      background-color: var(--lotus-green);
      color: #ffffff;
      border: none;
    }

    .action-small-btn.save-green:hover {
      background-color: var(--lotus-green-dark);
    }

    .action-small-btn.clear-red {
      background-color: #d92d20;
      color: #ffffff;
      border: none;
    }

    .action-small-btn.clear-red:hover {
      background-color: #b42318;
    }

    /* ================= ป๊อปอัปยืนยันสำเร็จ ================= */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 16px;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal-card {
      background: #ffffff;
      border: none;
      padding: 24px 28px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .check-circle {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background-color: var(--lotus-green);
      color: #ffffff;
      font-size: 32px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .modal-title {
      font-size: 18px;
      font-weight: bold;
      color: #000000;
    }

    .modal-btn {
      background-color: var(--lotus-green);
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }

    .modal-btn:hover {
      background-color: var(--lotus-green-dark);
    }

    /* ================= Responsive สำหรับ Tablet & Mobile ================= */
    @media (max-width: 900px) {
      .product-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .summary-action-bar {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 650px) {
      html, body {
        height: 100%;
        overflow: hidden;
      }

      .container {
        height: 100vh;
        min-height: 0;
        padding: 6px;
        overflow: hidden;
      }

      .history-top-bar {
        padding: 4px 6px;
        margin-bottom: 4px;
      }

      .saved-history-btn {
        font-size: 11.5px;
        padding: 3px 8px;
      }

      .top-bar {
        grid-template-columns: 1fr 1.15fr auto;
        gap: 4px;
        margin-bottom: 5px;
        flex-shrink: 0;
      }

      .top-right-brand-box {
        padding-right: 2px;
      }

      .mini-orders-web-logo {
        padding: 0 2px;
      }

      .mini-orders-web-logo .logo-top,
      .mini-orders-web-logo .logo-bottom {
        font-size: 13px;
      }

      .summary-date-time-row {
        grid-template-columns: 1.15fr 1fr;
        gap: 4px;
        margin-bottom: 4px;
      }

      .summary-delivery-card {
        padding: 5px 6px;
      }

      .delivery-row-1 {
        grid-template-columns: 1.45fr 1fr;
        gap: 4px;
        margin-bottom: 4px;
      }

      .field-box {
        min-height: 30px;
        padding: 2px 5px;
      }

      .field-box label {
        font-size: 11px;
        margin-right: 3px;
      }

      .field-box input,
      .field-box select,
      .login-input-wrap input {
        font-size: 12px;
      }

      .logout-btn {
        font-size: 10px;
        padding: 2px 5px;
      }

      .search-bar {
        grid-template-columns: 1.15fr 0.85fr;
        gap: 4px;
        margin-bottom: 5px;
        flex-shrink: 0;
      }

      .search-field-box {
        grid-column: 1 / -1;
        flex-wrap: nowrap;
        padding: 2px 4px;
        gap: 3px;
      }

      .search-field-box input {
        min-width: 0;
        flex: 1 1 auto;
        font-size: 12px;
      }

      .category-group {
        width: auto;
        margin-top: 0;
        gap: 2px;
      }

      .category-select {
        min-width: 78px;
        max-width: 102px;
        height: 26px;
        padding: 0 4px;
        font-size: 11px;
      }

      .cat-refresh-icon-btn {
        width: 26px;
        height: 26px;
        font-size: 13px;
      }

      .confirm-box-green {
        min-height: 32px;
      }

      .confirm-box-green span,
      .confirm-box-green button {
        font-size: 12.5px;
      }

      .summary-header-bar {
        grid-template-columns: 110px 1fr;
        gap: 6px;
        margin-bottom: 6px;
      }

      .back-btn,
      .summary-title-box {
        min-height: 32px;
        font-size: 12.5px;
        padding: 4px 6px;
      }

      .login-screen {
        min-height: 0;
        padding: 12px;
      }

      .login-card {
        padding: 22px 18px 20px;
      }

      .login-brand {
        font-size: 32px;
      }

      .catalog-box {
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }

      .product-wrapper {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 6px;
      }

      .category-sections-wrap {
        gap: 10px;
      }

      .category-section-header {
        border: none;
        font-size: 12px;
        padding: 4px 8px;
      }

      .category-horizontal-row {
        gap: 8px;
        padding-bottom: 6px;
      }

      .category-horizontal-row .product-card {
        flex: 0 0 142px;
        width: 142px;
      }

      .product-card {
        min-height: auto;
        padding: 6px;
        gap: 5px;
      }

      .card-img-box {
        border: none;
        height: 118px;
      }

      .price-tag {
        font-size: 10px;
        padding: 1px 5px;
      }

      .code-barcode-text,
      .unit-badge {
        font-size: 9.5px;
      }

      .card-name-box {
        font-size: 11px;
        min-height: 36px;
        padding: 4px;
      }

      .card-action-row {
        grid-template-columns: 28px 1fr 28px;
        grid-template-rows: 28px 26px;
        gap: 3px;

      }

      .qty-btn {
        min-height: 28px;
        font-size: 15px;
        font-weight: bold;
      }

      .qty-btn:first-of-type {
        grid-column: 1 / 2;
        grid-row: 1 / 2;
      }

      .qty-input {
        grid-column: 2 / 3;
        grid-row: 1 / 2;
        font-size: 16px;
        min-height: 28px;
      }

      .qty-btn:last-of-type {
        grid-column: 3 / 4;
        grid-row: 1 / 2;
      }

      .confirmed-status-box {
        grid-column: 1 / 4;
        grid-row: 2 / 3;

      .history-body {

      }

      .history-record-row {
        flex-direction: column;
        align-items: flex-start;
      }

      .history-record-row .action-small-btn {

  </style>
</head>
<body>

<div class="container">

  <!-- ================= หน้า Log In ================= -->
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="login-brand">
        <span class="brand-orders">Orders</span>
        <span class="brand-web">Web</span>
      </div>
      <div class="login-sub">Sign in to your account</div>

      <div class="login-field-group">
        <label for="loginCustId">รหัสลูกค้า</label>
        <div class="login-input-wrap">
          <input
            type="text"
            id="loginCustId"
            placeholder="20000XXXXX"
            autocomplete="off"
            inputmode="text"
            onkeydown="if(event.key==='Enter') handleLogin()"
          >
        </div>
      </div>

      <div class="remember-row">
        <label class="remember-label" for="rememberCustCheckbox">
          <input type="checkbox" id="rememberCustCheckbox" checked>
          <span>Remember me</span>
        </label>
      </div>

      <div id="loginMessage" class="login-msg info">กำลังเตรียมข้อมูลลูกค้าจากชีท...</div>

      <button type="button" class="login-btn" id="loginSubmitBtn" onclick="handleLogin()">
        SIGN IN
      </button>

      <button type="button" class="login-secondary-btn" id="loginSyncBtn" onclick="syncCustomersFromSheet()">
        &#8635; Refresh
      </button>
    </div>
  </div>

  <!-- ================= หน้าสั่งซื้อหลัก ================= -->
  <div id="orderScreen" style="display:none; flex-direction:column; flex:1; min-height:0;">
    <div class="history-top-bar" id="historyTopBar">
      <button type="button" class="saved-history-btn" onclick="openSavedHistoryScreen()">
        ประวัติคำสั่งซื้อ (<span id="savedCountBadge">0</span>)
      </button>
    </div>

    <div class="top-bar">
      <div class="field-box">
        <label for="custId">รหัส :</label>
        <input type="text" id="custId" class="cust-locked-input" readonly tabindex="-1">
        <button type="button" class="logout-btn" onclick="logoutToLogin()">Log Out</button>
      </div>
      <div class="field-box">
        <label for="custName">ชื่อ :</label>
        <input type="text" id="custName" class="cust-locked-input" readonly tabindex="-1">
      </div>
      <div class="top-right-brand-box" title="Orders Web">
        <div class="mini-orders-web-logo">
          <span class="logo-top">Orders</span>
          <span class="logo-bottom">Web</span>
        </div>
      </div>
    </div>

    <div class="section-box catalog-box">
      <div class="search-bar">
        <div class="field-box search-field-box">
          <label for="searchProduct">Search :</label>
          <input type="text" id="searchProduct" placeholder="ชื่อสินค้า / รหัส / บาร์โค๊ด" oninput="renderProducts()">
          <div class="category-group">
            <select id="categorySelect" class="category-select" onchange="onCategoryChange()" title="เลือกหมวดหมู่จากคอลัมน์ J">
              <option value="">หมวดหมู่</option>
            </select>
            <button type="button" class="cat-refresh-icon-btn" id="refreshBtn" onclick="forceRefreshData()" title="รีเฟรชข้อมูลหมวดหมู่และสินค้า">
              &#8635;
            </button>
          </div>
        </div>
        <div class="field-box">
          <label for="totalAmount">Total :</label>
          <input type="text" id="totalAmount" readonly value="฿0.00">
        </div>
        <div class="field-box confirm-box-green" onclick="openSummaryScreen()" title="คลิกเพื่อดูสรุปรายการสั่งซื้อ">
          <span>ยืนยัน</span>
        </div>
      </div>

      <div id="orderValidationNote" class="inline-validation-note"></div>

      <div class="product-wrapper">
        <div class="product-grid" id="productGrid">
          <div class="status-text">กำลังโหลดข้อมูลสินค้าจาก Google Sheet...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= หน้าสรุปรายการสั่งซื้อ ================= -->
  <div id="summaryScreen" class="summary-screen">
    <div class="summary-header-bar">
      <button type="button" class="back-btn" onclick="backToOrderScreen()">&lt; กลับไปหน้าสั่งซื้อ</button>
      <div class="summary-title-box">สรุปรายการสั่งซื้อ</div>
    </div>

    <div class="summary-panel">
      <div class="summary-customer-box" id="sumCustomerInfo">-</div>

      <div class="summary-delivery-card">
        <div class="summary-date-time-row">
          <div class="field-box">
            <label for="pickupDate">วันรับสินค้า :</label>
            <input type="date" id="pickupDate" onchange="enforceNextDayDate(); updateRedFieldColors();">
          </div>
          <div class="field-box" id="pickupTimeBox">
            <label for="pickupTime">เวลารับ :</label>
            <select id="pickupTime" onchange="clearMissingHighlight('pickupTime', 'pickupTimeBox'); updateRedFieldColors();">
              <option value="">เลือกเวลา</option>
              <option value="10:00-14:00น.">10:00-14:00น.</option>
              <option value="14:00-17:00น.">14:00-17:00น.</option>
            </select>
          </div>
        </div>

        <div class="delivery-row-1">
          <div class="field-box" id="addressBox">
            <label for="address">ที่อยู่จัดส่ง :</label>
            <input type="text" id="address" placeholder="พิมพ์ที่อยู่จัดส่ง" oninput="clearMissingHighlight('address', 'addressBox'); updateRedFieldColors();">
          </div>
          <div class="field-box" id="deliveryTypeBox">
            <label for="deliveryType">การจัดส่ง :</label>
            <select id="deliveryType" onchange="handleDeliveryTypeChange()">
              <option value="">เลือกประเภท</option>
              <option value="จัดส่ง">จัดส่ง</option>
              <option value="รับเอง">รับเอง</option>
            </select>
          </div>
        </div>

        <div class="delivery-row-2">
          <div class="field-box">
            <label for="remark">หมายเหตุ :</label>
            <input type="text" id="remark" placeholder="ระบุเพิ่มเติม (ถ้ามี)" oninput="updateRedFieldColors()">
          </div>
        </div>
      </div>

      <div id="summaryValidationNote" class="inline-validation-note"></div>

      <div class="summary-action-bar">
        <div class="summary-total-box" id="sumCountTotal">จำนวนสินค้าทั้งหมด 0 ชิ้น | 0 รายการ</div>
        <div class="summary-total-box" id="sumMoneyTotal">Total : ฿0.00</div>
        <button type="button" class="confirm-box-green" id="submitOrderBtn" onclick="submitOrderToSheet()">
          <span>ยืนยัน</span>
        </button>
      </div>

      <div class="summary-items-list" id="summaryItemsList"></div>
    </div>
  </div>

  <!-- ================= หน้า ประวัติคำสั่งซื้อ ================= -->
  <div id="historyScreen" class="history-screen">
    <div class="summary-header-bar">
      <button type="button" class="back-btn" onclick="closeSavedHistoryScreen()">&lt; กลับไปหน้าสั่งซื้อ</button>
      <div class="summary-title-box" id="historyScreenTitle">ประวัติคำสั่งซื้อ</div>
    </div>

    <div class="history-body">
      <div class="history-toolbar">
        <div style="display:flex; gap:6px;">
          <button type="button" class="action-small-btn save-green" onclick="downloadCurrentReceiptImage()">
            <span>Save</span>
          </button>
          <button type="button" class="action-small-btn clear-red" onclick="clearSavedOrdersForActiveCustomer()">
            <span>Clear</span>
          </button>
        </div>
      </div>

      <div id="historyRecordList" class="history-record-list"></div>

      <div class="image-preview-box" id="imagePreviewBox"></div>
    </div>
  </div>

</div>

<!-- ป๊อปอัปยืนยันคำสั่งซื้อเรียบร้อย -->
<div id="successModal" class="modal-backdrop">
  <div class="modal-card">
    <div class="check-circle">&#10003;</div>
    <div class="modal-title">ยืนยันคำสั่งซื้อเรียบร้อย</div>
    <button type="button" class="modal-btn" onclick="resetAfterSuccess()">กลับไปหน้าสั่งซื้อสินค้า</button>
  </div>
</div>

<script>
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxV-OU3V0eHblsXYXzFPgjIaVnI7JpHplmROFrmpgY_fRNUt-KYFPNHFt21nv9za1vH/exec';

  const CACHE_KEY = 'order_app_cache_v2';
  const SAVED_ORDERS_KEY = 'order_app_saved_orders_v1';
  const REMEMBER_CUST_KEY = 'order_app_remembered_cust_v1';
  const CACHE_TTL_MS = 30 * 60 * 1000;
  const SELF_PICKUP_ADDRESS_TEXT = 'มารับสินค้าเองที่สาขา';

  const FALLBACK_IMG = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
    <svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
      <rect width="160" height="160" fill="#ffffff"/>
      <text x="80" y="85" font-size="14" text-anchor="middle" fill="#667085" font-family="sans-serif">No Image</text>
    </svg>
  `);

  let productsData = [];
  let customersData = [];
  let cartQuantities = {};
  let dataLoadedPromise = null;
  let activeLoggedInCustId = '';
  let previousActiveScreen = 'orderScreen';
  let currentReceiptDataUrl = '';
  let currentReceiptFilename = 'order-form.png';
  let lastIsMobileLayout = window.innerWidth <= 650;

  function formatMoney2(val) {
    const num = Number(val || 0);
    const safeNum = Number.isFinite(num) ? num : 0;
    return '฿' + safeNum.toLocaleString('th-TH', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  }

  function restoreRememberedCustomer() {
    try {
      const raw = localStorage.getItem(REMEMBER_CUST_KEY);
      if (!raw) return;
      const parsed = JSON.parse(raw);
      const inputEl = document.getElementById('loginCustId');
      const cbEl = document.getElementById('rememberCustCheckbox');
      if (parsed && parsed.enabled && parsed.custId) {
        if (inputEl) inputEl.value = String(parsed.custId);
        if (cbEl) cbEl.checked = true;
      }
    } catch (_) {}
  }

  function saveRememberedCustomer(custId, enabled) {
    try {
      if (enabled && custId) {
        localStorage.setItem(REMEMBER_CUST_KEY, JSON.stringify({
          enabled: true,
          custId: String(custId).trim()
        }));
      } else {
        localStorage.removeItem(REMEMBER_CUST_KEY);
      }
    } catch (_) {}
  }

  window.addEventListener('DOMContentLoaded', () => {
    try {
      restoreRememberedCustomer();
      setDefaultNextDay();
      updateRedFieldColors();
      updateSavedCountBadge();
      dataLoadedPromise = loadInitialDataWithCache().then(() => {
        setLoginMessage('เข้าสู่ระบบเพื่อสั่งสินค้า', 'info');
      });
      const loginInput = document.getElementById('loginCustId');
      if (loginInput && !loginInput.value) loginInput.focus();
    } catch (err) {
      console.error('Init error:', err);
      setLoginMessage('เกิดข้อผิดพลาดในการเริ่มต้นระบบ: ' + err.message, 'error');
    }
    window.addEventListener('resize', () => {
      const isMobileNow = window.innerWidth <= 650;
      if (isMobileNow !== lastIsMobileLayout) {
        lastIsMobileLayout = isMobileNow;
        if (productsData.length > 0) renderProducts();
      }
    });
  });

  function handleDeliveryTypeChange() {
    clearMissingHighlight('deliveryType', 'deliveryTypeBox');
    const deliveryTypeVal = (document.getElementById('deliveryType')?.value || '').trim();
    const addrEl = document.getElementById('address');

    if (addrEl) {
      if (deliveryTypeVal === 'รับเอง') {
        addrEl.value = SELF_PICKUP_ADDRESS_TEXT;
        clearMissingHighlight('address', 'addressBox');
      } else if (deliveryTypeVal === 'จัดส่ง' && addrEl.value.trim() === SELF_PICKUP_ADDRESS_TEXT) {
        addrEl.value = '';
      }
    }

    updateRedFieldColors();
  }

  function updateRedFieldColors() {
    const redIds = ['address', 'deliveryType', 'pickupTime', 'pickupDate', 'remark'];
    redIds.forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      const hasVal = (el.value || '').trim() !== '';
      el.classList.toggle('red-filled-text', hasVal);
    });
  }

  function setValidationNote(msg = '', targetId = 'orderValidationNote') {
    const noteEl = document.getElementById(targetId);
    if (!noteEl) return;
    if (msg) {
      noteEl.textContent = msg;
      noteEl.classList.add('active');
    } else {
      noteEl.textContent = '';
      noteEl.classList.remove('active');
    }
  }

  function validateRequiredOrderFields(targetNoteId = 'summaryValidationNote') {
    const addressVal = (document.getElementById('address')?.value || '').trim();
    const pickupTimeVal = (document.getElementById('pickupTime')?.value || '').trim();
    const deliveryTypeVal = (document.getElementById('deliveryType')?.value || '').trim();

    const missing = [];
    const addrBox = document.getElementById('addressBox');
    const timeBox = document.getElementById('pickupTimeBox');
    const typeBox = document.getElementById('deliveryTypeBox');

    if (addrBox) addrBox.classList.toggle('missing-required', !addressVal);
    if (timeBox) timeBox.classList.toggle('missing-required', !pickupTimeVal);
    if (typeBox) typeBox.classList.toggle('missing-required', !deliveryTypeVal);

    if (!addressVal) missing.push('ที่อยู่จัดส่ง');
    if (!pickupTimeVal) missing.push('เวลารับ');
    if (!deliveryTypeVal) missing.push('ประเภทการจัดส่ง');

    if (missing.length > 0) {
      setValidationNote(`กรุณากรอกข้อมูลให้ครบ: ${missing.join(' / ')}`, targetNoteId);
      if (!addressVal) {
        document.getElementById('address')?.focus();
      } else if (!pickupTimeVal) {
        document.getElementById('pickupTime')?.focus();
      } else if (!deliveryTypeVal) {
        document.getElementById('deliveryType')?.focus();
      }
      return false;
    }

    setValidationNote('', targetNoteId);
    return true;
  }

  function clearMissingHighlight(inputId, boxId) {
    const inputEl = document.getElementById(inputId);
    const boxEl = document.getElementById(boxId);
    if (inputEl && boxEl && (inputEl.value || '').trim() !== '') {
      boxEl.classList.remove('missing-required');
    }

    const addressVal = (document.getElementById('address')?.value || '').trim();
    const pickupTimeVal = (document.getElementById('pickupTime')?.value || '').trim();
    const deliveryTypeVal = (document.getElementById('deliveryType')?.value || '').trim();
    if (addressVal && pickupTimeVal && deliveryTypeVal) {
      setValidationNote('', 'summaryValidationNote');
      setValidationNote('', 'orderValidationNote');
    }
  }

  function getActiveCustomerId() {
    const fieldVal = (document.getElementById('custId')?.value || '').trim();
    return fieldVal || activeLoggedInCustId || '';
  }

  function getAllSavedOrders() {
    try {
      const raw = localStorage.getItem(SAVED_ORDERS_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (_) {
      return [];
    }
  }

  function setAllSavedOrders(list) {
    try {
      localStorage.setItem(SAVED_ORDERS_KEY, JSON.stringify(list));
    } catch (_) {}
    updateSavedCountBadge();
  }

  function getCustomerSavedOrders(custId = getActiveCustomerId()) {
    const target = String(custId || '').trim().toLowerCase();
    if (!target) return [];
    return getAllSavedOrders().filter(rec => String(rec.custId || '').trim().toLowerCase() === target);
  }

  function updateSavedCountBadge() {
    const custId = getActiveCustomerId();
    const records = getCustomerSavedOrders(custId);

    const badge = document.getElementById('savedCountBadge');
    if (badge) {
      badge.textContent = String(records.length);
    }
  }

  function formatStampDateTime(now = new Date()) {
    const dd = String(now.getDate()).padStart(2, '0');
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const yyyy = now.getFullYear();
    const hh = String(now.getHours()).padStart(2, '0');
    const min = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');
    return {
      orderDate: `${dd}/${mm}/${yyyy}`,
      orderTime: `${hh}:${min}:${ss}`
    };
  }

  function saveOrderRecord(payload, items) {
    const stamp = formatStampDateTime(new Date());
    const totalQty = items.reduce((sum, i) => sum + Number(i.qty || 0), 0);
    const resolvedCustId = (payload.custId || getActiveCustomerId() || '-').trim();
    const record = {
      id: 'ORD-' + Date.now(),
      orderDate: stamp.orderDate,
      orderTime: stamp.orderTime,
      custId: resolvedCustId,
      custName: payload.custName || '-',
      pickupDate: payload.pickupDate || '-',
      pickupTime: payload.pickupTime || '-',
      deliveryType: payload.deliveryType || '-',
      address: payload.address || '-',
      remark: payload.remark || '-',
      totalAmount: payload.totalAmount || formatMoney2(0),
      totalQty,
      itemCount: items.length,
      items
    };

    const existing = getAllSavedOrders();
    existing.unshift(record);
    setAllSavedOrders(existing.slice(0, 100));
    return record;
  }

    const tableTop = 196;
    ctx.fillStyle = '#f1f5f9';

    ctx.font = 'bold 13px Sarabun, Tahoma, sans-serif';

      ctx.fillText(label.slice(0, 48), 34, y + 28);

      ctx.textAlign = 'right';
      ctx.fillText(`${item.qty} ${item.unit || 'ชิ้น'}`, width - 230, y + 28);
      ctx.fillText(formatMoney2(item.price), width - 125, y + 28);
      ctx.fillText(formatMoney2(item.subtotal), width - 34, y + 28);

    const footY = tableTop + 30 + Math.max(items.length, 1) * rowHeight + 10;

    ctx.strokeStyle = '#102538';

    if (customersData.length === 0 && dataLoadedPromise) {
      if (loginBtn) loginBtn.disabled = true;

        await dataLoadedPromise;

  function formatOrderedStatus(qty, unit) {

  function fetchViaJsonp(url) {
    return new Promise((resolve, reject) => {
      const cbName = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
      const script = document.createElement('script');
      const sep = url.includes('?') ? '&' : '?';

      const timer = setTimeout(() => {
        cleanup();
        reject(new Error('JSONP Timeout'));
      }, 15000);

      function cleanup() {
        clearTimeout(timer);
        if (script.parentNode) script.parentNode.removeChild(script);
        delete window[cbName];
      }

      window[cbName] = (data) => {
        cleanup();
        resolve(data);
      };

      script.onerror = () => {
        cleanup();
        reject(new Error('JSONP Load Error'));
      };

      script.src = `${url}${sep}action=getData&callback=${cbName}`;
      document.body.appendChild(script);
    });
  }

  async function fetchSheetData() {
    if (window.google && google.script && google.script.run) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .getInitialData();
      });
    }

    try {
      const response = await fetch(`${APPS_SCRIPT_URL}?action=getData`);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return await response.json();
    } catch (fetchErr) {
      return await fetchViaJsonp(APPS_SCRIPT_URL);
    }
  }

  async function forceRefreshData() {

    }

    }

        btn.disabled = false;

  async function loadInitialDataWithCache(options = {}) {
    const { skipCacheDisplay = false } = options;
    const grid = document.getElementById('productGrid');
    let hasValidCache = false;

    if (!skipCacheDisplay) {
      try {
        const cachedRaw = localStorage.getItem(CACHE_KEY);
        if (cachedRaw) {
          const cached = JSON.parse(cachedRaw);
          const isExpired = (Date.now() - (cached.timestamp || 0)) > CACHE_TTL_MS;
          if (Array.isArray(cached.products) && cached.products.length > 0) {
            productsData = cached.products;
            customersData = Array.isArray(cached.customers) ? cached.customers : [];
            populateCategories();
            renderProducts();
            hasValidCache = !isExpired;
          }
        }
      } catch (e) {
        localStorage.removeItem(CACHE_KEY);
      }
    }

    try {
      const result = await fetchSheetData();
      if (result && Array.isArray(result.products)) {
        productsData = result.products;
        customersData = Array.isArray(result.customers) ? result.customers : [];

        try {
          localStorage.setItem(CACHE_KEY, JSON.stringify({
            timestamp: Date.now(),
            products: productsData,
            customers: customersData
          }));
        } catch (_) {}

        populateCategories();
        renderProducts();
        if (document.getElementById('custId')?.value.trim()) {
          autoFillCustomer();
        }
      } else if (!hasValidCache && grid) {
        grid.innerHTML = `<div class="status-text">ไม่พบข้อมูลสินค้าในระบบ</div>`;
      }
    } catch (error) {
      console.error('Fetch error:', error);
      if (!hasValidCache && grid) {
        grid.innerHTML = `<div class="status-text" style="color:#d9534f;">โหลดข้อมูลจาก Google Sheet ไม่สำเร็จ (${error.message})</div>`;
      }
      throw error;
    }
  }

  function formatImageUrl(rawUrl) {
    const url = String(rawUrl || '').trim();
    if (!url) return FALLBACK_IMG;

    const driveMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if (driveMatch && driveMatch[1] && url.includes('drive.google.com')) {
      return `https://drive.google.com/thumbnail?id=${driveMatch[1]}&sz=w600`;
    }

    return url;
  }

  function buildProductCardHtml(item) {
    const confirmedQty = cartQuantities[item.code] || 0;
    const inputQty = confirmedQty > 0 ? String(confirmedQty) : '';
    const price = Number(item.price || 0);
    const unit = item.unit || 'ชิ้น';
    const rawImg = item.image || item.img || item.imageUrl || item.pic || '';
    const imgSrc = formatImageUrl(rawImg);

    return `
      <div class="product-card">
        <div class="card-img-box">
          <span class="price-tag">${formatMoney2(price)}</span>
          <img
            src="${imgSrc}"
            loading="lazy"
            referrerpolicy="no-referrer"
            alt="${item.name || ''}"
            title="${rawImg || 'ไม่มีลิงก์รูป'}"
            onerror="this.onerror=null;this.src='${FALLBACK_IMG}';this.dataset.failed='1';"
          >
        </div>
        <div class="card-meta-row">
          <div class="code-barcode-text" title="${item.code || ''} | ${item.barcode || '-'}">
            ${item.code || ''}<span class="code-sep">|</span>${item.barcode || '-'}
          </div>
          <div class="unit-badge">${unit}</div>
        </div>
        <div class="card-name-box">${item.name || ''}</div>
        <div class="card-action-row">
          <button type="button" class="qty-btn" onmousedown="event.preventDefault()" onclick="changeQty('${item.code}', -1)">-</button>
          <input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" class="qty-input" id="qty_${item.code}" value="${inputQty}" oninput="handleQtyInput('${item.code}')" onblur="formatQtyOnBlur('${item.code}')">
          <button type="button" class="qty-btn" onmousedown="event.preventDefault()" onclick="changeQty('${item.code}', 1)">+</button>
          <div class="confirmed-status-box ${confirmedQty > 0 ? 'has-qty' : ''}" id="status_${item.code}">
            ${formatOrderedStatus(confirmedQty, unit)}
          </div>
        </div>
      </div>
    `;
  }

  function renderProducts() {
    const grid = document.getElementById('productGrid');
    if (!grid) return;

    const keyword = (document.getElementById('searchProduct')?.value || '').trim().toLowerCase();
    const selectedCat = document.getElementById('categorySelect')?.value || '';

    const filtered = productsData.filter(item => {
      const matchCat = !selectedCat || item.category === selectedCat;
      const matchKey = !keyword ||
        String(item.name || '').toLowerCase().includes(keyword) ||
        String(item.code || '').toLowerCase().includes(keyword) ||
        String(item.barcode || '').toLowerCase().includes(keyword);
      return matchCat && matchKey;
    });

    if (filtered.length === 0) {
      grid.className = 'product-grid';
      grid.innerHTML = `<div class="status-text">ไม่พบรายการสินค้า</div>`;
      return;
    }

    const isMobile = window.innerWidth <= 650;
    if (isMobile) {
      grid.className = 'category-sections-wrap';
      const grouped = new Map();
      filtered.forEach(item => {
        const catName = item.category || 'ไม่ระบุหมวดหมู่';
        if (!grouped.has(catName)) grouped.set(catName, []);
        grouped.get(catName).push(item);
      });

      grid.innerHTML = Array.from(grouped.entries()).map(([catName, items]) => `
        <section class="category-section-block">
          <div class="category-section-header">
            <span>${catName}</span>
            <span>${items.length} รายการ</span>
          </div>
          <div class="category-horizontal-row">
            ${items.map(buildProductCardHtml).join('')}
          </div>
        </section>
      `).join('');
      return;
    }

    grid.className = 'product-grid';
    grid.innerHTML = filtered.map(buildProductCardHtml).join('');
  }

  function syncCardCartAndTotal(code, qty) {
    const product = productsData.find(p => String(p.code) === String(code));
    const unit = (product && product.unit) || 'ชิ้น';
    const safeQty = qty > 0 ? Math.floor(qty) : 0;

    if (safeQty > 0) {
      cartQuantities[code] = safeQty;
    } else {
      delete cartQuantities[code];
    }

    const statusBox = document.getElementById(`status_${code}`);
    if (statusBox) {
      const nextText = formatOrderedStatus(safeQty, unit);
      if (statusBox.textContent !== nextText) {
        statusBox.textContent = nextText;
      }
      statusBox.classList.toggle('has-qty', safeQty > 0);
    }

    calculateTotal();
  }

  function handleQtyInput(code) {
    const input = document.getElementById(`qty_${code}`);
    if (!input) return;
    const digitsOnly = String(input.value || '').replace(/[^0-9]/g, '');
    const parsed = digitsOnly === '' ? 0 : parseInt(digitsOnly, 10);
    syncCardCartAndTotal(code, Number.isFinite(parsed) && parsed > 0 ? parsed : 0);
  }

  function formatQtyOnBlur(code) {
    const input = document.getElementById(`qty_${code}`);
    if (!input) return;
    const digitsOnly = String(input.value || '').replace(/[^0-9]/g, '');
    const parsed = digitsOnly === '' ? 0 : parseInt(digitsOnly, 10);
    const safeQty = Number.isFinite(parsed) && parsed > 0 ? parsed : 0;
    const formatted = safeQty > 0 ? String(safeQty) : '';
    if (input.value !== formatted) {
      input.value = formatted;
    }
    syncCardCartAndTotal(code, safeQty);
  }

  function changeQty(code, delta) {
    const input = document.getElementById(`qty_${code}`);
    const currentRaw = input ? String(input.value || '').replace(/[^0-9]/g, '') : '';
    const currentVal = currentRaw !== ''
      ? Math.max(0, parseInt(currentRaw, 10) || 0)
      : (cartQuantities[code] || 0);
    const nextQty = Math.max(0, currentVal + delta);
    if (input) {
      input.value = nextQty > 0 ? String(nextQty) : '';
    }
    syncCardCartAndTotal(code, nextQty);
  }

  function getSelectedItems() {
    return Object.entries(cartQuantities)
      .filter(([, qty]) => qty > 0)
      .map(([code, qty]) => {
        const p = productsData.find(item => String(item.code) === String(code)) || {};
        const price = Number(p.price || 0);
        return {
          code,
          name: p.name || '',
          price,
          qty,
          unit: p.unit || 'ชิ้น',
          subtotal: price * qty
        };
      });
  }

  function calculateTotal() {
    const items = getSelectedItems();
    const total = items.reduce((sum, item) => sum + item.subtotal, 0);
    const totalEl = document.getElementById('totalAmount');
    if (totalEl) {
      const nextVal = formatMoney2(total);
      if (totalEl.value !== nextVal) {
        totalEl.value = nextVal;
      }
    }
  }

  function autoFillCustomer() {
    const rawId = document.getElementById('custId')?.value || '';
    const found = findCustomerByCode(rawId);
    if (found) {
      const nameEl = document.getElementById('custName');
      const addrEl = document.getElementById('address');
      const deliveryTypeVal = (document.getElementById('deliveryType')?.value || '').trim();
      if (nameEl) nameEl.value = found.name || found.custName || '';
      if (addrEl) {
        if (deliveryTypeVal === 'รับเอง') {
          addrEl.value = SELF_PICKUP_ADDRESS_TEXT;
        } else if (found.address) {
          addrEl.value = found.address;
        }
        clearMissingHighlight('address', 'addressBox');
        updateRedFieldColors();
      }
    }
  }

  function setDefaultNextDay() {
    const dateInput = document.getElementById('pickupDate');
    if (!dateInput) return;
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    const yyyy = tomorrow.getFullYear();
    const mm = String(tomorrow.getMonth() + 1).padStart(2, '0');
    const dd = String(tomorrow.getDate()).padStart(2, '0');
    const minDate = `${yyyy}-${mm}-${dd}`;
    dateInput.min = minDate;
    if (!dateInput.value) dateInput.value = minDate;
    updateRedFieldColors();
  }

  function enforceNextDayDate() {
    const dateInput = document.getElementById('pickupDate');
    if (!dateInput) return;
    if (dateInput.value && dateInput.min && dateInput.value < dateInput.min) {
      dateInput.value = dateInput.min;
    }
    updateRedFieldColors();
  }

  function openSummaryScreen() {
    const items = getSelectedItems();
    if (items.length === 0) {
      setValidationNote('กรุณาเพิ่มจำนวนสินค้าอย่างน้อย 1 รายการก่อนยืนยัน', 'orderValidationNote');
      document.getElementById('orderValidationNote')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }

    setValidationNote('', 'orderValidationNote');
    setValidationNote('', 'summaryValidationNote');
    setDefaultNextDay();
    updateRedFieldColors();

    const custId = document.getElementById('custId')?.value.trim() || '-';
    const custName = document.getElementById('custName')?.value.trim() || '-';

    const totalQty = items.reduce((sum, item) => sum + item.qty, 0);
    const totalMoney = items.reduce((sum, item) => sum + item.subtotal, 0);

    document.getElementById('sumCustomerInfo').textContent = ` ${custId}  |   ${custName}`;
    document.getElementById('sumCountTotal').textContent = `จำนวนสินค้าทั้งหมด ${totalQty} ชิ้น | ${items.length} รายการ`;
    document.getElementById('sumMoneyTotal').textContent = `Total : ${formatMoney2(totalMoney)}`;

    document.getElementById('summaryItemsList').innerHTML = items.map(item => `
      <div class="summary-item-card">
        <div><strong>${item.name}</strong></div>
        <div>จำนวน ${item.qty} ${item.unit} | ราคาต่อชิ้น ${formatMoney2(item.price)} | ราคารวม ${formatMoney2(item.subtotal)}</div>
      </div>
    `).join('');

    document.getElementById('orderScreen').style.display = 'none';
    document.getElementById('historyScreen').classList.remove('active');
    document.getElementById('summaryScreen').classList.add('active');
    window.scrollTo(0, 0);
  }

  function backToOrderScreen() {
    document.getElementById('summaryScreen').classList.remove('active');
    document.getElementById('orderScreen').style.display = 'flex';
    updateSavedCountBadge();
    window.scrollTo(0, 0);
  }

  async function submitOrderToSheet() {
    if (!validateRequiredOrderFields('summaryValidationNote')) {
      return;
    }

    const items = getSelectedItems();
    if (items.length === 0) return;

    const totalMoney = items.reduce((sum, item) => sum + item.subtotal, 0);
    const totalFormatted = formatMoney2(totalMoney);
    const stamp = formatStampDateTime(new Date());
    const resolvedCustId = (document.getElementById('custId')?.value || activeLoggedInCustId || '').trim();

    const payload = {
      action: 'saveOrder',
      orderDate: stamp.orderDate,
      orderTime: stamp.orderTime,
      custId: resolvedCustId,
      custName: document.getElementById('custName')?.value.trim() || '',
      pickupDate: document.getElementById('pickupDate')?.value || '',
      address: document.getElementById('address')?.value.trim() || '',
      pickupTime: document.getElementById('pickupTime')?.value || '',
      deliveryType: document.getElementById('deliveryType')?.value || '',
      remark: document.getElementById('remark')?.value.trim() || '',
      totalAmount: totalFormatted,
      items
    };

    const btn = document.getElementById('submitOrderBtn');
    if (btn) btn.disabled = true;

    try {
      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      saveOrderRecord(payload, items);
      document.getElementById('successModal').classList.add('active');
    } catch (err) {
      console.error('Submit order error:', err);
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  function resetAfterSuccess() {
    document.getElementById('successModal').classList.remove('active');
    document.getElementById('summaryScreen').classList.remove('active');
    document.getElementById('historyScreen').classList.remove('active');
    document.getElementById('orderScreen').style.display = 'flex';
    window.scrollTo(0, 0);

    cartQuantities = {};
    setValidationNote('', 'orderValidationNote');
    setValidationNote('', 'summaryValidationNote');
    ['address', 'remark', 'searchProduct'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
    ['pickupTime', 'deliveryType', 'categorySelect'].forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.value = '';
        el.classList.remove('has-filter');
      }
    });

    const custIdEl = document.getElementById('custId');
    if (custIdEl && activeLoggedInCustId) {
      custIdEl.value = activeLoggedInCustId;
      custIdEl.readOnly = true;
      autoFillCustomer();
    }

    const custNameEl = document.getElementById('custName');
    if (custNameEl) custNameEl.readOnly = true;

    clearMissingHighlight('address', 'addressBox');
    clearMissingHighlight('pickupTime', 'pickupTimeBox');
    clearMissingHighlight('deliveryType', 'deliveryTypeBox');

    setDefaultNextDay();
    updateRedFieldColors();
    calculateTotal();
    renderProducts();
    updateSavedCountBadge();
  }
</script>

</body>
</html>
